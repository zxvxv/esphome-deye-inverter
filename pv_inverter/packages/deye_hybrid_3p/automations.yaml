# --- POCZĄTEK PLIKU AUTOMATIONS DEYE ---
switch:
  - platform: gpio
    pin: GPIO47
    id: waveshare_relay
    name: "Stycznik Zewnętrzny (GPIO47)"
    restore_mode: ALWAYS_OFF
    icon: "mdi:relay"

select:
  - platform: template
    name: "Tryb pracy przekaźnika (Stycznik)"
    id: relay_mode
    optimistic: true
    options:
      - "Wyłączony"
      - "Ręczny"
      - "Przepięcie Sieci"
      - "Nadmiar Baterii"
      - "Chłodzenie Inwertera"
    initial_option: "Wyłączony"
    icon: "mdi:state-machine"

number:
  - platform: template
    name: "Napięcie załączenia (Stycznik)"
    id: relay_volt_on
    optimistic: true
    min_value: 240
    max_value: 260
    step: 0.1
    initial_value: 251.0
    unit_of_measurement: "V"
    icon: "mdi:lightning-bolt"
    mode: box

  - platform: template
    name: "Napięcie wyłączenia (Stycznik)"
    id: relay_volt_off
    optimistic: true
    min_value: 230
    max_value: 255
    step: 0.1
    initial_value: 248.0
    unit_of_measurement: "V"
    icon: "mdi:lightning-bolt-outline"
    mode: box

  - platform: template
    name: "Bateria SOC załączenia (Stycznik)"
    id: relay_soc_on
    optimistic: true
    min_value: 50
    max_value: 100
    step: 1
    initial_value: 98
    unit_of_measurement: "%"
    icon: "mdi:battery-arrow-up"
    mode: box

  - platform: template
    name: "Bateria SOC wyłączenia (Stycznik)"
    id: relay_soc_off
    optimistic: true
    min_value: 40
    max_value: 99
    step: 1
    initial_value: 90
    unit_of_measurement: "%"
    icon: "mdi:battery-arrow-down"
    mode: box

  - platform: template
    name: "Temperatura załączenia (Stycznik)"
    id: relay_temp_on
    optimistic: true
    min_value: 20
    max_value: 80
    step: 1
    initial_value: 44.0
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-chevron-up"
    mode: box

  - platform: template
    name: "Temperatura wyłączenia (Stycznik)"
    id: relay_temp_off
    optimistic: true
    min_value: 20
    max_value: 80
    step: 1
    initial_value: 41.0
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-chevron-down"
    mode: box

interval:
  - interval: 5s
    then:
      - lambda: |-
          auto mode_opt = id(relay_mode).active_index();
          int mode_idx = mode_opt.has_value() ? mode_opt.value() : 0;

          if (mode_idx == 0) {
            if (id(waveshare_relay).state) {
              id(waveshare_relay).turn_off();
            }
          }
          else if (mode_idx == 1) {
            // Tryb Ręczny - czekaj na interwencję użytkownika
          }
          else if (mode_idx == 2) {
            float v1 = id(grid_voltage_l1).state;
            float v2 = id(grid_voltage_l2).state;
            float v3 = id(grid_voltage_l3).state;
            
            float max_v = v1;
            if (v2 > max_v) max_v = v2;
            if (v3 > max_v) max_v = v3;

            if (max_v >= id(relay_volt_on).state) {
              if (!id(waveshare_relay).state) id(waveshare_relay).turn_on();
            } else if (max_v <= id(relay_volt_off).state) {
              if (id(waveshare_relay).state) id(waveshare_relay).turn_off();
            }
          }
          else if (mode_idx == 3) {
            float soc = id(deye_battery_soc).state;
            
            if (soc >= id(relay_soc_on).state) {
              if (!id(waveshare_relay).state) id(waveshare_relay).turn_on();
            } else if (soc <= id(relay_soc_off).state) {
              if (id(waveshare_relay).state) id(waveshare_relay).turn_off();
            }
          }
          else if (mode_idx == 4) {
            float temp = id(deye_ac_temperature).state;
            
            if (temp >= id(relay_temp_on).state) {
              if (!id(waveshare_relay).state) id(waveshare_relay).turn_on();
            } else if (temp <= id(relay_temp_off).state) {
              if (id(waveshare_relay).state) id(waveshare_relay).turn_off();
            }
          }
# --- KONIEC PLIKU AUTOMATIONS DEYE ---
