battery.yaml
Plik

Ten battery.yaml to jest właśnie plik, w którym możemy zrobić największe sensowne odchudzenie, bo masz tu sporo parametrów stricte pod sterowanie napięciowe i akumulatory ołowiowe.

Najpierw rzeczy, które moim zdaniem zostają koniecznie:

energia baterii: Daily/Total Battery Charge/Discharge — rejestry 514–519, bo są potrzebne do bilansu i sprawności systemu. 


podstawowa telemetria baterii: temperatura 586, napięcie 587, SOC 588, moc 590, prąd 591, pojemność skorygowana 592. 


cała grupa BMS związana z prądami i SOC: charging/discharging current 212–213, SOC 214, BMS Voltage 215, BMS Current 216, max charge/discharge current 218–219. 


Battery Alarm 220 i Battery Fault 221 — zdecydowanie zostają. 


Battery Control Mode 98, Battery Operation Mode 111, Battery BMS Type 223 — zostawiłbym. Operation Mode zawiera wprawdzie opcję Voltage, ale sama możliwość wyboru Capacity (%) / No battery jest istotna. Nie usuwałbym całej encji tylko dlatego, że jedna opcja to Voltage. 


Battery Wake Up, Battery 2 Wake Up, Battery Generator Charging, Battery Grid Charging — zostawić. 


Battery Generator Charging Start SOC 124, prąd ładowania generatora 125, Battery Grid Charging Start SOC 127 — zostawić. 


Battery Shutdown SOC 115, Restart SOC 116, Low SOC 117 — zostawić. To jest właśnie nasz świat SOC/BMS. 


Battery Capacity 102, Maximum Battery Charge Current 108, Maximum Battery Discharge Current 109, Maximum Battery Grid Charge Current 128 — zostawić. 


Teraz rzeczy, które zgodnie z naszą zasadą wywaliłbym:

Battery Generator Charging Start Voltage — 123

Battery Grid Charging Start Voltage — 126

Battery Shutdown Voltage — 118

Battery Restart Voltage — 119

Battery Low Voltage — 120

Battery Equalization Voltage — 99

Battery Absorption Voltage — 100

Battery Float Voltage — 101

Battery Empty Voltage — 103

To są dokładnie parametry sterowania napięciowego baterią. 


Do tego ja bym usunął też całą sekcję typową dla ołowiu:

Battery Equalization Cycle — 105

Battery Equalization Time — 106

Battery Temperature Compensation — 107

Battery Resistance — 113

Jeśli ALPHA BOX ma być budowany pod nowoczesne systemy z BMS/LiFePO4, to te parametry są nam zbędne. 


Battery Charging Efficiency 114 bym natomiast zostawił. To może być przydatne w obliczeniach i diagnostyce. 


Mam jeszcze trzy punkty do decyzji:

Battery BMS Charging Voltage 210 i Battery BMS Discharging Voltage 211 — to nie są nasze nastawy trybu Voltage, tylko wartości pochodzące z BMS. Ja bym zostawił, bo są diagnostyczne. 


Battery BMS Other Symbol 222 — nazwa jest bardzo niejasna. To dla mnie mocny kandydat do usunięcia, jeśli nie wykorzystujemy go nigdzie. 


cała grupa Battery 2 — SOC 589, Voltage 593, Current 594, Power 595, Temperature 596. Jeśli chcesz zachować kompatybilność z układami z drugą baterią / drugim portem baterii, zostawiłbym. Jeśli nie — można to wyciąć jako cały blok. 


Mój werdykt na dziś:

REMOVE na pewno: 99, 100, 101, 103, 105, 106, 107, 113, 118, 119, 120, 123, 126.
REMOVE prawdopodobnie: 222.
KEEP: cała reszta, w tym BMS Voltage 210/211/215 oraz wszystkie progi i sterowania po SOC.

Jeśli się z tym zgadzasz, mogę od razu wygenerować Ci kompletny battery.yaml po tym odchudzeniu.


Wiesz co? Battery voltage 2. Pytanie, w których inwerterach DITO występuje? Bo w niskonapięciowych nie. Tak mi się wydaje. Chyba że ale w tych o większej mocy. Ale zgadzam się z tobą. Wywalmy wszystko, jeszcze sprawdzam to. Tak, to, co ty sugerujesz do wywalania, Pulsela jest 2 2 2 też wywalamy.

Sprawdziłem temat Battery 2: w oficjalnych danych Deye nawet seria SUN-5/6/8/10/12K-SG04LP3-EU ma deklarowane 2 wejścia baterii, więc Battery 2 zostawiłem. To samo dotyczy nowszych LV 14–20 kW. 

Usunąłem natomiast wszystkie uzgodnione rzeczy:

napięciowe sterowanie baterią: 99, 100, 101, 103, 118, 119, 120, 123, 126

parametry typowo „ołowiowe”: 105, 106, 107, 113

Battery BMS Other Symbol — 222

Zostawiłem BMS-y, SOC, prądy, limity, Battery 2, alarmy/faulty i całą resztę potrzebną operacyjnie. Źródłowo te sekcje były w battery.yaml. 


