# --- POCZĄTEK PLIKU DEYE HYBRID 3P LV ---
# Wersja: v1.03
# Zmiany:
# - Zastąpiono przestarzały atrybut .state wywołaniem .current_option() dla encji system_work_mode, aby dostosować kod do nowych wymogów ESPHome 2026.8+.
# - Wdrożono sprzętowe zabezpieczenie pamięci EEPROM (Flash) w skrypcie set_safe_modbus_registers poprzez dodanie weryfikacji stanu przed komendą zapisu.
# - Usunięto potężny, zduplikowany blok encji baterii wklejony bezpośrednio w kodzie, polegając wyłącznie na czystym imporcie z packages (odblokowanie Modbus).
